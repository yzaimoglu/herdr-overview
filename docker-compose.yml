services:
  overview-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      HERDR_BIN_PATH: ${HERDR_BIN_PATH:-herdr}
      HERDR_DEMO: ${HERDR_DEMO:-true}
      AI_SUB_SERVER_SOCKET: ${AI_SUB_SERVER_SOCKET:-/run/user/1000/ai-sub-server.sock}
      HOME: ${HOME}
    volumes:
      - ${HERDR_HOST_BIN:-${HOME}/.local/bin/herdr}:/usr/local/bin/herdr:ro
      - ${HOME}:${HOME}:ro
      - ${AI_SUB_SERVER_SOCKET:-/run/user/1000/ai-sub-server.sock}:/run/user/1000/ai-sub-server.sock
    restart: unless-stopped

  caddy:
    build: .
    depends_on:
      - overview-api
    ports:
      - "127.0.0.1:9952:80"
    networks:
      default: {}
      caddy_default:
          aliases:
            - herdr-caddy
    restart: unless-stopped

networks:
  caddy_default:
    external: true
    name: caddy_default
